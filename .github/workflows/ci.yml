name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    # 🟢 React Frontend
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm install
        npm run build

    # 🔵 Node Backend
    - name: Install backend dependencies
      run: |
        cd Server
        npm install